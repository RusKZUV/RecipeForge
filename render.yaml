# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
databases:
  - name: recipeforge-db
    databaseName: recipeforge
    user: recipeforge
    plan: free

services:
  - type: web
    name: recipeforge-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recipeforge-db
          property: connectionString
      - key: PORT
        value: "8000"
